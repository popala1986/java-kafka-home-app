name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Nowy push do tego samego PR anuluje stary, niedokończony przebieg
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-auth-service, chore-planner-service, notification-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Checkstyle + kompilacja + testy (Testcontainers używa Dockera z runnera)
      - name: Build, Checkstyle, testy
        run: ./mvnw -B verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalacja zależności
        run: npm ci

      - name: Build
        run: npm run build
