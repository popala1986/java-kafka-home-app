server:
  port: 8081

spring:
  application:
    name: user-auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/auth_db
    username: ${DB_USERNAME:homeapp}
    password: ${DB_PASSWORD:password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
        # Dopisuje nagłówek correlationId do każdej wysyłanej wiadomości (Krok 10b).
        interceptor.classes: com.homeapp.auth.correlation.CorrelationIdProducerInterceptor

app:
  jwt:
    # Lokalnie działa wartość domyślna. Na serwerze podamy prawdziwy sekret w zmiennej JWT_SECRET.
    secret: ${JWT_SECRET:local-dev-secret-change-me-at-least-32-bytes-long}
    expiration: ${JWT_EXPIRATION:PT1H}

logging:
  pattern:
    # W każdej linijce logu, przed nazwą klasy: [correlationId] albo [-], gdy go nie ma.
    correlation: "[%X{correlationId:--}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
