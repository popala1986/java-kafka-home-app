server:
  port: 8082

spring:
  application:
    name: chore-planner-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/planner_db
    username: ${DB_USERNAME:homeapp}
    password: ${DB_PASSWORD:password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: chore-planner-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.homeapp.planner.member.UserRegisteredEvent
        spring.json.use.type.headers: false
    # Od Kroku 9a planner też wysyła eventy (chore.daily.digest). Ustawienia jak w user-auth-service.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
        # Dopisuje nagłówek correlationId do każdej wysyłanej wiadomości (Krok 10b).
        interceptor.classes: com.homeapp.planner.correlation.CorrelationIdProducerInterceptor

app:
  jwt:
    # Ten sam sekret co w user-auth-service: planner sprawdza podpis tokenu wydanego przez auth.
    secret: ${JWT_SECRET:local-dev-secret-change-me-at-least-32-bytes-long}
  planner:
    # Kiedy automat układa plan na następny tydzień: sekunda minuta godzina dzień miesiąc dzień-tygodnia.
    # Tu: w każdą niedzielę o 18:00 (strefa Europe/Warsaw).
    weekly-plan-cron: ${WEEKLY_PLAN_CRON:0 0 18 * * SUN}
    # Poranne podsumowanie zadań: codziennie o 6:30.
    daily-digest-cron: ${DAILY_DIGEST_CRON:0 30 6 * * *}

logging:
  pattern:
    # W każdej linijce logu, przed nazwą klasy: [correlationId] albo [-], gdy go nie ma.
    correlation: "[%X{correlationId:--}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
